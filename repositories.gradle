// Add any additional repositories for your dependencies here.

def legacyScalaModules = ['scala-parser-combinators_2.11', 'scala-swing_2.11', 'scala-xml_2.11']

// RetroFuturaGradle uses the old Forge coordinates for these Scala modules.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.scala-lang' && legacyScalaModules.contains(details.requested.name)) {
            details.useTarget("org.scala-lang.modules:${details.requested.name}:${details.requested.version}")
            details.because('Use the original Scala modules published on Maven Central')
        }
    }
}

repositories {
    remove(findByName('OvermindDL1 Forge repo mirror'))
    exclusiveContent {
        forRepository {
            mavenCentral { name = 'Maven Central Scala modules' }
        }
        filter {
            legacyScalaModules.each { includeModule('org.scala-lang.modules', it) }
        }
    }
    flatDir {
        dirs("libs")
    }
    maven {
        url = uri("https://maven.aliyun.com/nexus/content/groups/public/")
    }
    maven {
        url = uri("https://maven.aliyun.com/nexus/content/repositories/jcenter")
    }
    maven {
        url = uri("https://nexus.jsdu.cn")
    }
    maven {
        url = uri("https://maven.cleanroommc.com")
    }
    maven {
        url = uri("https://cfa2.cursemaven.com")
    }
    maven {
        url = uri("https://cursemaven.com")
    }
    maven {
        url = uri("https://maven.blamejared.com/")
    }
    maven {
        url = uri("https://repo.spongepowered.org/maven")
    }
    maven {
        name = "GeckoLib"
        url = uri("https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/")
    }
    maven {
        name = "GTNH Maven"
        url = uri("https://nexus.gtnewhorizons.com/repository/public/")
    }
    maven {
        url = uri("https://jitpack.io")
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}
